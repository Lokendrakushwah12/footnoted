[project]
name = "footnoted"
version = "0.1.0"
description = "Retrieval over documentation that can always say which page an answer came from."
authors = [
    { name = "Lokendra", email = "lokendrakushwah8051@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
]

[project.scripts]
footnoted = "footnoted:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
